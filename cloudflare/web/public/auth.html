<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="" />
    <title>oraja-training アカウント</title>
  </head>
  <body>
    <main>
      <h1>oraja-training</h1>
      <section aria-labelledby="register-title">
        <h2 id="register-title">アカウント登録</h2>
        <form id="register-form" method="post" action="/v1/auth/register">
          <label>ユーザーID <input name="user_id" minlength="3" maxlength="32" pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{2,31}" autocomplete="username" required /></label>
          <label>パスワード <input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required /></label>
          <label>利用規約の版 <input name="terms_version" value="current" required /></label>
          <label>プライバシー規約の版 <input name="privacy_version" value="current" required /></label>
          <label><input name="terms_consent" type="checkbox" required /> 利用規約に同意する</label>
          <label><input name="privacy_consent" type="checkbox" required /> プライバシー規約に同意する</label>
          <button type="submit">登録</button>
        </form>
      </section>
      <section aria-labelledby="login-title">
        <h2 id="login-title">ログイン</h2>
        <form method="post" action="/v1/auth/login">
          <label>ユーザーID <input name="user_id" autocomplete="username" required /></label>
          <label>パスワード <input name="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">ログイン</button>
        </form>
      </section>
      <p>パスワード、復旧コード、確認トークンはブラウザへ保存しません。</p>
    </main>
  </body>
</html>
