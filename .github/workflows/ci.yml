name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest tests/test_contracts.py -q
      - run: pytest -q

  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_VERSION: ${{ github.sha }}
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run schema:check
      - run: npm run check
      - run: npm run typecheck
      - run: mkdir -p artifacts
      - run: npm sbom --package-lock-only --sbom-format cyclonedx > artifacts/cloudflare-sbom.json
      - run: node -e "JSON.parse(require('fs').readFileSync('artifacts/cloudflare-sbom.json', 'utf8'))"
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-sbom
          path: cloudflare/artifacts/cloudflare-sbom.json
      - run: npm run deploy:preview:dry

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm --prefix cloudflare run container:build
